<!-- SECTION 2 : MODULE PUBLICATIONS DES BANS DE MARIAGE                  -->
      <!-- ==================================================================== -->
      <div id="section-bans" class="hidden space-y-8">
        <div
          class="bg-white rounded-3xl p-5 sm:p-8 shadow-xl border border-slate-200"
        >
          <!-- EN-TÊTE AVEC BOUTON RETOUR AU SUIVI -->
          <div
            class="pb-6 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4"
          >
            <div>
              <div class="flex items-center gap-3 mb-2">
                <button
                  type="button"
                  onclick="switchTab('suivi')"
                  class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
                >
                  <span>⬅️</span>
                  <span>Retour au Suivi</span>
                </button>
                <span
                  class="text-xs font-black uppercase tracking-widest text-blue-700 bg-blue-50 px-3 py-1 rounded-full"
                >
                  REGISTRE NATIONAL DÉMATÉRIALISÉ
                </span>
              </div>

              <h2 class="text-xl sm:text-2xl font-black text-slate-900 mt-1">
                Publications Légales des Bans de Mariage
              </h2>
              <p class="text-xs sm:text-sm text-slate-600 mt-0.5">
                Affichage public obligatoire préalable de 10 à 30 jours
                calendaires (Article 53 de la Loi N° 2011/011).
              </p>
            </div>

            <div class="flex items-center gap-4 self-start md:self-auto">
              <div class="text-right">
                <span class="text-xs text-slate-500 block"
                  >Projets affichés</span
                >
                <span
                  id="bans-count-display"
                  class="text-2xl sm:text-3xl font-black text-slate-900"
                  >3</span
                >
              </div>
            </div>
          </div>

          <!-- Filtres multicritères -->
          <div class="mt-6 pt-4 border-t border-slate-100">
            <div class="flex flex-col sm:flex-row sm:items-center gap-2">
              <div class="relative flex-1">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-base">🔎</span>
                <input
                  id="search-bans-input"
                  type="text"
                  placeholder="Rechercher une publication..."
                  oninput="filtrerBans()"
                  class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 pl-10 text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                />
              </div>
            </div>
          </div>

          <div
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5 mt-6"
          >
            <div>
              <label
                class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5"
                >Région</label
              >
              <select
                id="filter-region"
                onchange="filtrerBans()"
                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500"
              >
                <option value="ALL">Toutes les régions (10)</option>
              </select>
            </div>

            <div>
              <label
                class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5"
                >Commune / Mairie</label
              >
              <select
                id="filter-commune"
                onchange="filtrerBans()"
                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500"
              >
                <option value="ALL">Toutes les communes</option>
              </select>
            </div>

            <div>
              <label
                class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5"
                >Statut du Ban</label
              >
              <select
                id="filter-statut"
                onchange="filtrerBans()"
                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500"
              >
                <option value="ALL">Tous les statuts</option>
                <option value="EN_COURS_AFFICHAGE">En cours d'affichage</option>
                <option value="EXPIRANT_SOUS_48H">
                  Expirant dans moins de 48h
                </option>
                <option value="CLOTURE_SANS_OPPOSITION">
                  Affichage clôturé sans opposition
                </option>
                <option value="OPPOSITION_ENREGISTREE">
                  Opposition enregistrée
                </option>
              </select>
            </div>

            <div>
              <label
                class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5"
                >Régime Matrimonial</label
              >
              <select
                id="filter-regime"
                onchange="filtrerBans()"
                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500"
              >
                <option value="ALL">Tous les régimes</option>
                <option value="MONOGAMIE_BIENS_COMMUNS">
                  Monogamie / Biens Communs
                </option>
                <option value="MONOGAMIE_SEPARATION_BIENS">
                  Monogamie / Séparation
                </option>
                <option value="POLYGAMIE">Polygamie</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Grille des bans -->
        <div
          id="grid-bans"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6"
        >
          <!-- Rendu dynamique JS -->
        </div>
      </div>

      <!-- ==================================================================== -->
